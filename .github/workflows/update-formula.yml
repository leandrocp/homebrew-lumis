name: Update formula

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: update-formula-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.update.outputs.changed }}
      version: ${{ steps.update.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@824c0e29fdfc7d689c191c27acc969d2d04b7dd8 # v1
        with:
          ruby-version: "3.4"
      - run: gem install minitest --version '~> 5.0' --no-document
      - name: Test updater
        run: ruby scripts/update-formula_test.rb
      - name: Generate and verify candidate
        id: update
        run: ruby scripts/update-formula.rb
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.update.outputs.changed == 'true' || github.event_name == 'pull_request'
        with:
          name: formula
          path: Formula/lumis.rb
          if-no-files-found: error

  test:
    needs: generate
    if: needs.generate.outputs.changed == 'true' || github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: Homebrew/actions/setup-homebrew@4790763c0a3ba4036f72634dc079c4a7dfcd4878
        with:
          stable: true
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: formula
          path: Formula
      - name: Install and test candidate
        run: |
          brew install --formula leandrocp/lumis/lumis
          brew test leandrocp/lumis/lumis
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"

  publish:
    needs: [generate, test]
    if: >-
      needs.generate.outputs.changed == 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: formula
          path: Formula
      - name: Publish tested formula
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/lumis.rb
          git commit -m "chore: update lumis to ${VERSION}"
          git push origin HEAD:main
        env:
          VERSION: ${{ needs.generate.outputs.version }}
